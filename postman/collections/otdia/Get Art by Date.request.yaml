$kind: http-request
description: |-
  ## On This Day in Art

  Searches The Metropolitan Museum of Art collection for artworks with images, using today's date as the keyword. Uses a three-tier fallback to ensure a result is always returned.

  ### The Met Museum API
  Base URL: https://collectionapi.metmuseum.org/public/collection/v1/

  ### Variables
  - `todayLabel` — Human-readable date label (e.g., "June 2"), set automatically by the pre-request script.
  - `searchQuery` — The active search term, updated by the pre-request script each time the request runs.

  ### Fallback tiers
  1. Full date match — e.g. "June 2"
  2. Month only — e.g. "June"
  3. Full collection — wildcard search (`*`)

  ### Response
  Returns `{ total, objectIDs }` — use the objectIDs to fetch individual artwork details from:
  `GET /objects/{objectID}`
url: https://collectionapi.metmuseum.org/public/collection/v1/search?q={{searchQuery}}&hasImages=true
method: GET
queryParams:
  q: "{{searchQuery}}"
  hasImages: "true"
scripts:
  - type: beforeRequest
    code: |-
      // "On This Day in Art" — build search query based on today's date
      const now = new Date();
      const month = now.getMonth() + 1; // 1-12
      const day = now.getDate();        // 1-31

      const monthNames = ["January","February","March","April","May","June",
                          "July","August","September","October","November","December"];
      const monthName = monthNames[month - 1];
      const todayLabel = `${monthName} ${day}`;
      const monthLabel = monthName;

      // Store labels for use in test script and downstream requests
      pm.variables.set("todayLabel", todayLabel);
      pm.variables.set("monthLabel", monthLabel);
      pm.variables.set("searchQuery", todayLabel); // start with full "June 2" search

      console.log(`Searching for: "${todayLabel}"`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      const todayLabel = pm.variables.get("todayLabel");   // e.g. "June 2"
      const monthLabel = pm.variables.get("monthLabel");   // e.g. "June"

      function pickRandom(objectIDs) {
          const randomIndex = Math.floor(Math.random() * Math.min(objectIDs.length, 100));
          return objectIDs[randomIndex];
      }

      function setResult(objectId, searchUsed) {
          pm.collectionVariables.set("randomObjectId", objectId);
          pm.collectionVariables.set("searchUsed", searchUsed);
          console.log(`randomObjectId: ${objectId} | search used: "${searchUsed}"`);
      }

      if (json.total > 0 && json.objectIDs) {
          // Primary: full date match e.g. "June 2"
          pm.test("Results found for today's date", function () {
              pm.expect(json.total).to.be.above(0);
              console.log(`Found ${json.total} artworks matching "${todayLabel}"`);
          });
          setResult(pickRandom(json.objectIDs), todayLabel);
      } else {
          // Fallback 1: month only e.g. "June"
          console.log(`No results for "${todayLabel}" — trying month-only: "${monthLabel}"`);
          const monthUrl = `https://collectionapi.metmuseum.org/public/collection/v1/search?q=${encodeURIComponent(monthLabel)}&hasImages=true`;

          pm.sendRequest(monthUrl, function (err, monthRes) {
              if (!err && monthRes) {
                  const monthJson = monthRes.json();
                  if (monthJson.total > 0 && monthJson.objectIDs) {
                      pm.test("Results found for this month", function () {
                          pm.expect(monthJson.total).to.be.above(0);
                          console.log(`Found ${monthJson.total} artworks matching "${monthLabel}"`);
                      });
                      setResult(pickRandom(monthJson.objectIDs), monthLabel);
                      return;
                  }
              }

              // Fallback 2: full collection wildcard
              console.log(`No results for "${monthLabel}" — falling back to full collection`);
              const allUrl = `https://collectionapi.metmuseum.org/public/collection/v1/search?q=*&hasImages=true`;

              pm.sendRequest(allUrl, function (err2, allRes) {
                  if (!err2 && allRes) {
                      const allJson = allRes.json();
                      pm.test("Fallback: collection results found", function () {
                          pm.expect(allJson.total).to.be.above(0);
                      });
                      if (allJson.total > 0 && allJson.objectIDs) {
                          setResult(pickRandom(allJson.objectIDs), "collection");
                      }
                  }
              });
          });
      }
    language: text/javascript
order: 2000
