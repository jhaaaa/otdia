$kind: http-request
description: |-
  ## Get Gemini Summary

  Uses the Google Gemini API (free tier) to generate a warm, layperson-friendly summary of the artwork fetched by **Get Artwork Detail**.

  ### Setup
  1. Get a free Gemini API key at https://aistudio.google.com/app/apikey
  2. Add it as a collection variable named `geminiApiKey`

  ### Variables
  - `geminiApiKey` — Your Google Gemini API key (store as a secret collection variable)
  - `artworkData` — JSON string of artwork metadata, set automatically by the previous request

  ### Response
  The summary text is in:
  `response.candidates[0].content.parts[0].text`
url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
method: POST
headers:
  Content-Type: application/json
  x-goog-api-key: "{{geminiApiKey}}"
body:
  type: json
  content: |-
    {
      "contents": [
        {
          "role": "user",
          "parts": [
            {
              "text": "Describe this artwork."
            }
          ]
        }
      ],
      "generationConfig": {
        "temperature": 0.95,
        "maxOutputTokens": 2000
      }
    }
scripts:
  - type: beforeRequest
    code: |-
      const artworkData = pm.collectionVariables.get("artworkData") || "{}";
      const todayLabel = pm.variables.get("todayLabel") || "today";
      const searchUsed = pm.collectionVariables.get("searchUsed") || "department";

      const bodyObj = {
          contents: [{
              role: "user",
              parts: [{
                  text: `You are Chillomena Punk — a deadpan, confidently misinformed art commentator. You speak with total authority about things you clearly don't understand, ask rhetorical questions that make no sense, go on brief tangents that are historically wrong in a funny way, and yet somehow stumble onto something genuinely true and interesting about the subject. Your tone is dry, absurd, and very funny — but the real facts about the artwork must still come through.

      Based on the following artwork metadata from The Metropolitan Museum of Art, write a Chillomena Punk-style commentary on this piece. It should be funny, punchy, and exactly around 150 words. No more than 150 words.

      Make sure the commentary conveys: what the artwork looks like and what's happening in it, something about the artist or the era, and why it matters — all filtered through Chillomena's unique lens.
      Keep all content family-friendly and avoid anything harmful, offensive, or inappropriate — Chillomena is baffled by art, not by decency.

      Artwork metadata:
      ${artworkData}`
              }]
          }],
          generationConfig: {
              temperature: 0.95,
              maxOutputTokens: 2000
          }
      };

      pm.request.body.update({
          mode: 'raw',
          raw: JSON.stringify(bodyObj)
      });
    language: text/javascript
order: 4000
