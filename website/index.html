<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>On This Day in Art</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>

  <header>
    <div class="header-title">
      <h1>On This Day <em>in Art</em></h1>
    </div>
    <div class="date-display">
      <div class="date-day" id="date-day">—</div>
      <div class="date-month-year" id="date-month-year">Loading…</div>
    </div>
  </header>

  <div class="config-bar">
    <button class="btn" id="load-btn">Discover Today's Piece</button>
    <button class="btn btn-secondary" id="random-btn">Surprise Me</button>
  </div>

  <main>
    <div id="status" class="status-welcome"></div>
    <div id="gallery">
      <div class="art-placeholder">
        <img src="chillomena-punk.png" alt="Chillomena Punk" />
      </div>
    </div>
  </main>

  <footer>
    <span>Collection data: <a href="https://metmuseum.github.io/" target="_blank" rel="noopener">The Metropolitan Museum of Art Open Access API</a></span>
    <span>Commentary by <a href="https://deepmind.google/technologies/gemini/" target="_blank" rel="noopener">Gemini</a> in a voice inspired by Philomena Cunk · Built with Postman Agent Mode</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
